name: Bank Sync

on:
  schedule:
    - cron: '0 3 * * *'  # כל לילה ב-3:00 בלילה (שעון UTC = 6:00 בוקר ישראל)
  workflow_dispatch:       # אפשרות להריץ ידנית

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Run bank sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCOUNT_USER: ${{ secrets.DISCOUNT_CODE }}
          DISCOUNT_PASS: ${{ secrets.DISCOUNT_PASS }}
          ISRACARD_ID: ${{ secrets.ISRACARD_ID }}
          ISRACARD_PASS: ${{ secrets.ISRACARD_PASS }}
          ISRACARD_CARD6: ${{ secrets.ISRACARD_CARD6 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/sync-bank.mjs
